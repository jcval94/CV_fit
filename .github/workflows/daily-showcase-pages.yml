name: Deploy daily CV showcase to GitHub Pages

on:
  workflow_run:
    workflows: ["Incremental vacancy ingest"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Incremental vacancy ingest run id containing the daily-showcase artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve source workflow run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_id=$MANUAL_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Download static daily showcase
        uses: actions/download-artifact@v4
        with:
          name: daily-showcase
          path: _site
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
