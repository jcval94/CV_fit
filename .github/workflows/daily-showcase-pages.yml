name: Deploy daily CV showcase to GitHub Pages

on:
  workflow_run:
    workflows: ["Incremental vacancy ingest"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "cv_presentation/showcase.py"
      - "cv_presentation/showcase_refresh.py"
      - "cv_presentation/showcase_snapshot.py"
      - "cv_presentation/feed_enhancements.py"
      - "cv_presentation/p0_decision_ux.py"
      - "cv_notifications/**"
      - "cv_observability/**"
      - ".github/workflows/daily-showcase-pages.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Incremental vacancy ingest run id containing a non-empty daily-showcase artifact"
        required: false
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CVFIT_EVENT_LOG: /tmp/cvfit-observability/pages-events.jsonl
      CVFIT_RUN_ID: pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and download latest non-empty CV showcase
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          rm -rf _site /tmp/cvfit-showcase-candidate

          candidates=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${MANUAL_RUN_ID:-}" ]; then
            # Explicit manual source means exactly that run; fail rather than silently
            # substituting another artifact if it contains no CV outputs.
            candidates+=("$MANUAL_RUN_ID")
          else
            if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${WORKFLOW_RUN_ID:-}" ]; then
              candidates+=("$WORKFLOW_RUN_ID")
            fi
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              candidates+=("$run_id")
            done < <(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/vacancy-ingest.yml/runs?branch=main&status=success&per_page=20" \
                --jq '.workflow_runs[].id'
            )
          fi

          selected=""
          seen=" "
          for run_id in "${candidates[@]}"; do
            case "$seen" in
              *" $run_id "*) continue ;;
            esac
            seen="$seen$run_id "
            rm -rf /tmp/cvfit-showcase-candidate
            mkdir -p /tmp/cvfit-showcase-candidate
            echo "Inspecting daily-showcase from run $run_id"
            if ! gh run download "$run_id" -n daily-showcase -D /tmp/cvfit-showcase-candidate; then
              echo "Run $run_id has no downloadable daily-showcase artifact; trying previous successful run."
              continue
            fi
            cv_count="$(find /tmp/cvfit-showcase-candidate/vacancies -type f \( -name 'cv_primary.html' -o -name 'cv_alternate.html' \) 2>/dev/null | wc -l | tr -d ' ')"
            echo "Run $run_id contains $cv_count public CV HTML artifact(s)."
            if [ "${cv_count:-0}" -gt 0 ]; then
              mv /tmp/cvfit-showcase-candidate _site
              selected="$run_id"
              echo "cv_count=$cv_count" >> "$GITHUB_OUTPUT"
              break
            fi
          done

          if [ -z "$selected" ]; then
            echo "No successful vacancy-ingest run with a non-empty CV showcase was found."
            echo "Refusing to replace the currently deployed Pages site with an empty feed."
            exit 2
          fi
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "Using non-empty daily-showcase artifact from run $selected"

      - name: Resolve previous non-empty CV showcase for carry-forward
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf _previous_site /tmp/cvfit-previous-candidate
          echo "found=false" >> "$GITHUB_OUTPUT"
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$CURRENT_RUN_ID" ] || continue
            rm -rf /tmp/cvfit-previous-candidate
            mkdir -p /tmp/cvfit-previous-candidate
            if ! gh run download "$run_id" -n daily-showcase -D /tmp/cvfit-previous-candidate; then
              continue
            fi
            cv_count="$(find /tmp/cvfit-previous-candidate/vacancies -type f \( -name 'cv_primary.html' -o -name 'cv_alternate.html' \) 2>/dev/null | wc -l | tr -d ' ')"
            if [ "${cv_count:-0}" -gt 0 ] && [ -f /tmp/cvfit-previous-candidate/showcase.json ]; then
              mv /tmp/cvfit-previous-candidate _previous_site
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Previous non-empty showcase found in run $run_id"
              break
            fi
          done < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/vacancy-ingest.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs[].id'
          )

      - name: Carry forward missing public CV bundles
        if: steps.previous.outputs.found == 'true'
        run: >-
          python -m cv_presentation.showcase_snapshot
          --site-dir _site
          --previous-site-dir _previous_site

      - name: Refresh vacancy + two-CV feed without model calls
        run: python -m cv_presentation.showcase_refresh --site-dir _site

      - name: Log published Pages snapshot
        if: always()
        run: python -m cv_observability.stage_reports pages --site-dir _site

      - name: Verify Pages source still contains CV artifacts
        run: |
          set -euo pipefail
          count="$(find _site/vacancies -type f \( -name 'cv_primary.html' -o -name 'cv_alternate.html' \) | wc -l | tr -d ' ')"
          test "$count" -gt 0
          echo "Publishing $count CV HTML artifact(s) from ingest run ${{ steps.source.outputs.run_id }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Log Pages deployment
        if: always() && steps.deployment.outputs.page_url != ''
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          CV_COUNT: ${{ steps.source.outputs.cv_count }}
        run: |
          python - <<'PY'
          import os
          from cv_observability import EventLogger
          EventLogger('pages_deploy').info(
              'pages_deployed',
              page_url=os.environ.get('PAGE_URL'),
              source_ingest_run_id=os.environ.get('SOURCE_RUN_ID'),
              cv_html_count=os.environ.get('CV_COUNT'),
          )
          PY

      - name: Check WhatsApp notification configuration
        id: whatsapp-config
        env:
          WHATSAPP_NOTIFICATIONS_ENABLED: ${{ vars.WHATSAPP_NOTIFICATIONS_ENABLED }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
        run: |
          set -euo pipefail
          if [ "${WHATSAPP_NOTIFICATIONS_ENABLED,,}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "WhatsApp notifications are disabled by repository variable."
            exit 0
          fi
          missing=()
          [ -n "${WHATSAPP_ACCESS_TOKEN:-}" ] || missing+=(WHATSAPP_ACCESS_TOKEN)
          [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ] || missing+=(WHATSAPP_PHONE_NUMBER_ID)
          [ -n "${WHATSAPP_RECIPIENT:-}" ] || missing+=(WHATSAPP_RECIPIENT)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "WhatsApp notifications requested but required secrets are missing: ${missing[*]}"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Reserve new READY WhatsApp notifications
        id: whatsapp-reserve
        if: steps.whatsapp-config.outputs.enabled == 'true'
        env:
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_TEMPLATE_LANGUAGE }}
        run: |
          set -euo pipefail
          python -m cv_notifications.whatsapp reserve \
            --site-dir _site \
            --state generation_state/whatsapp_notifications.json \
            --plan /tmp/cvfit_whatsapp_plan.json \
            --page-url "${{ steps.deployment.outputs.page_url }}"
          count="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/cvfit_whatsapp_plan.json').read_text(encoding='utf-8'))['count'])
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Reserved $count new READY WhatsApp notification(s)."

      - name: Persist WhatsApp reservations before delivery
        id: whatsapp-reservation-commit
        if: steps.whatsapp-config.outputs.enabled == 'true' && steps.whatsapp-reserve.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generation_state/whatsapp_notifications.json
          git commit -m "chore: reserve WhatsApp CV notifications"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Send reserved WhatsApp notifications
        id: whatsapp-send
        if: steps.whatsapp-config.outputs.enabled == 'true' && steps.whatsapp-reserve.outputs.count != '0' && steps.whatsapp-reservation-commit.outcome == 'success'
        continue-on-error: true
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
        run: >-
          python -m cv_notifications.whatsapp send
          --state generation_state/whatsapp_notifications.json
          --plan /tmp/cvfit_whatsapp_plan.json

      - name: Persist WhatsApp delivery result
        if: always() && steps.whatsapp-config.outputs.enabled == 'true' && steps.whatsapp-reserve.outputs.count != '0' && steps.whatsapp-reservation-commit.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generation_state/whatsapp_notifications.json
          if git diff --cached --quiet; then
            echo "No WhatsApp delivery-state change to persist."
            exit 0
          fi
          git commit -m "chore: record WhatsApp CV notification result"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Log WhatsApp notification state
        if: always()
        run: >-
          python -m cv_observability.stage_reports whatsapp
          --state generation_state/whatsapp_notifications.json
          --plan /tmp/cvfit_whatsapp_plan.json

      - name: Upload redacted Pages observability events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvfit-pages-observability-${{ github.run_id }}
          path: /tmp/cvfit-observability/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on ambiguous or failed WhatsApp delivery
        if: always() && steps.whatsapp-send.outcome == 'failure'
        run: |
          echo "At least one WhatsApp notification failed or has unknown delivery. State was preserved; automatic resend is intentionally disabled."
          exit 1
