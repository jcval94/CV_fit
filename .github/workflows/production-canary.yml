name: Production readiness canary

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[eval] Run production readiness canary'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_APY_KEY: ${{ secrets.OPENAI_APY_KEY }}
      CANARY_VACANCY_ID: vac-04e92192e608ea02
      CANARY_RUN_ID: prod-canary-${{ github.run_id }}
      CVFIT_EVENT_LOG: /tmp/cvfit-observability/events.jsonl
      CVFIT_RUN_ID: prod-canary-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Require live OpenAI credential
        run: |
          if [ -z "$OPENAI_APY_KEY" ]; then
            echo "OPENAI_APY_KEY is missing; production canary cannot prove live readiness."
            exit 2
          fi

      - name: Build isolated vacancy and evidence state
        run: |
          python -m vacancy_pipeline --repo . --state-dir /tmp/vacancy_state --run-id "$CANARY_RUN_ID" --source-commit "$(git rev-parse HEAD)" --full-rebuild --fail-on-quarantine
          python -m rag.evidence --repo . --state-dir /tmp/rag_state --run-id "$CANARY_RUN_ID" --source-commit "$(git rev-parse HEAD)" --full-rebuild
          python - <<'PY'
          import json, os
          from pathlib import Path
          vacancy_id = os.environ['CANARY_VACANCY_ID']
          record = json.loads((Path('/tmp/vacancy_state/records') / f'{vacancy_id}.json').read_text(encoding='utf-8'))
          assert record['jd_generation_eligible'] is True, record
          Path('/tmp/canary-ingest.json').write_text(json.dumps({'reindexed_vacancy_ids': [vacancy_id]}), encoding='utf-8')
          PY

      - name: Generate and review CV with live OpenAI
        run: >-
          python -m cv_auto
          --ingest-report /tmp/canary-ingest.json
          --vacancy-state /tmp/vacancy_state
          --evidence-state /tmp/rag_state
          --generation-state /tmp/generation_state
          --outputs outputs/auto
          --run-id "$CANARY_RUN_ID"
          --source-commit "$(git rev-parse HEAD)"
          --retrieval-mode hybrid-rerank
          --max-vacancies-per-run 1
          --max-estimated-cost-usd 5.0

      - name: Generate grounded cover letter
        run: >-
          python -m cv_agent.cover_letter_batch
          --batch-report "outputs/auto/_batch/$CANARY_RUN_ID/generation_run_report.json"
          --outputs outputs/auto
          --vacancy-state /tmp/vacancy_state
          --generation-state /tmp/generation_state
          --max-estimated-cost-usd 1.5

      - name: Build and validate HTML/PDF presentation bundle
        run: >-
          python -m cv_presentation.batch_bundle
          --batch-report "outputs/auto/_batch/$CANARY_RUN_ID/generation_run_report.json"
          --outputs outputs/auto
          --vacancy-state /tmp/vacancy_state
          --generation-state /tmp/generation_state
          --identity-public cv_presentation/identity.public.yaml
          --brand-profiles-dir cv_presentation/brands
          --max-design-cost-usd 1.5

      - name: Assert E2E canary completed without execution failure
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id = os.environ['CANARY_RUN_ID']
          vacancy_id = os.environ['CANARY_VACANCY_ID']
          batch = json.loads((Path('outputs/auto/_batch') / run_id / 'generation_run_report.json').read_text(encoding='utf-8'))
          generated = next(item for item in batch['results'] if item.get('vacancy_id') == vacancy_id)
          assert generated['status'] in {'PASS', 'COMPLETED_BELOW_TARGET'}, generated
          bundle_batch = json.loads((Path('outputs/auto/_batch') / run_id / 'application_bundle_batch_report.json').read_text(encoding='utf-8'))
          result = next(item for item in bundle_batch['results'] if item.get('vacancy_id') == vacancy_id)
          assert result['status'] in {'PASS', 'REVIEW_REQUIRED'}, result
          run_dir = Path('outputs/auto') / vacancy_id / generated['run_id']
          required = ['cv_final.json', 'cover_letter_final.md', 'cv_primary.html', 'cv_primary.pdf', 'application_bundle_report.json']
          missing = [name for name in required if not (run_dir / name).exists()]
          assert not missing, missing
          manifest = json.loads(Path('/tmp/generation_state/manifest.json').read_text(encoding='utf-8'))
          entry = manifest['entries'][vacancy_id]
          summary = {
              'vacancy_id': vacancy_id,
              'generation_status': generated['status'],
              'presentation_status': result['status'],
              'ready_to_send': bool(result.get('ready_to_send')),
              'headhunter_score': entry.get('headhunter_score'),
              'coverage_score': entry.get('coverage_score'),
              'generation_cost_usd': result.get('generation_cost_usd'),
              'cover_letter_cost_usd': result.get('cover_letter_cost_usd'),
              'presentation_cost_usd': result.get('presentation_cost_usd'),
              'total_pipeline_known_cost_usd': result.get('total_pipeline_known_cost_usd'),
              'total_pipeline_cost_complete': result.get('total_pipeline_cost_complete'),
          }
          Path('/tmp/production-canary-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Add canary summary to workflow
        if: always()
        run: |
          if [ -f /tmp/production-canary-summary.json ]; then
            echo '## Production readiness canary' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/production-canary-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment sanitized result on trigger issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/production-canary-summary.json ]; then
            { echo '### Production readiness canary'; echo; echo '```json'; cat /tmp/production-canary-summary.json; echo '```'; } > /tmp/canary-comment.md
          else
            printf '### Production readiness canary\n\nThe canary did not reach the final summary. Inspect the workflow logs; no WhatsApp notification was attempted.\n' > /tmp/canary-comment.md
          fi
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/canary-comment.md

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-canary-${{ github.run_id }}
          path: |
            outputs/auto/
            /tmp/production-canary-summary.json
            /tmp/cvfit-observability/
          if-no-files-found: warn
          retention-days: 7
