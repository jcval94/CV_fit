name: Production readiness canary

on:
  workflow_dispatch:
    inputs:
      vacancy_id:
        description: "Canonical vacancy to validate"
        required: true
        default: "vac-04e92192e608ea02"
        type: string

permissions:
  contents: read

concurrency:
  group: production-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_APY_KEY: ${{ secrets.OPENAI_APY_KEY }}
      CANARY_VACANCY_ID: ${{ inputs.vacancy_id }}
      CANARY_RUN_ID: prod-canary-${{ github.run_id }}
      CVFIT_EVENT_LOG: /tmp/cvfit-observability/events.jsonl
      CVFIT_RUN_ID: prod-canary-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Require live OpenAI credential
        run: |
          if [ -z "$OPENAI_APY_KEY" ]; then
            echo "OPENAI_APY_KEY is missing; production canary cannot prove live readiness."
            exit 2
          fi

      - name: Build isolated vacancy and full Retrieval V2 state
        id: retrieval
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m vacancy_pipeline \
            --repo . \
            --state-dir /tmp/vacancy_state \
            --run-id "$CANARY_RUN_ID" \
            --source-commit "$(git rev-parse HEAD)" \
            --full-rebuild \
            --fail-on-quarantine

          rm -rf /tmp/rag_state
          cp -a rag_state /tmp/rag_state
          python -m rag.evidence \
            --repo . \
            --state-dir /tmp/rag_state \
            --run-id "$CANARY_RUN_ID" \
            --source-commit "$(git rev-parse HEAD)"
          python -m rag.dense --state-dir /tmp/rag_state

          python - <<'PY'
          import json, os
          from pathlib import Path

          state = Path('/tmp/rag_state')
          required_state = ['manifest.json', 'lexical_index.json', 'dense_index.json', 'relations.json']
          missing_state = [name for name in required_state if not (state / name).exists() or (state / name).stat().st_size == 0]
          assert not missing_state, f'incomplete Retrieval V2 state: {missing_state}'

          vacancy_id = os.environ['CANARY_VACANCY_ID']
          record = json.loads((Path('/tmp/vacancy_state/records') / f'{vacancy_id}.json').read_text(encoding='utf-8'))
          assert record['jd_generation_eligible'] is True, record
          Path('/tmp/canary-ingest.json').write_text(
              json.dumps({'reindexed_vacancy_ids': [vacancy_id]}),
              encoding='utf-8',
          )
          print('retrieval_v2_canary_preflight=PASS', required_state)
          PY

      - name: Generate and semantically validate CV with live OpenAI
        id: generation
        if: steps.retrieval.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m cv_auto \
            --ingest-report /tmp/canary-ingest.json \
            --vacancy-state /tmp/vacancy_state \
            --evidence-state /tmp/rag_state \
            --generation-state /tmp/generation_state \
            --outputs outputs/auto \
            --run-id "$CANARY_RUN_ID" \
            --source-commit "$(git rev-parse HEAD)" \
            --retrieval-mode hybrid-rerank \
            --max-vacancies-per-run 1 \
            --max-estimated-cost-usd 5.0

          python - <<'PY'
          import json, os
          from pathlib import Path

          vacancy_id = os.environ['CANARY_VACANCY_ID']
          run_id = os.environ['CANARY_RUN_ID']
          batch_path = Path('outputs/auto/_batch') / run_id / 'generation_run_report.json'
          batch = json.loads(batch_path.read_text(encoding='utf-8'))
          result = next((item for item in batch.get('results', []) if item.get('vacancy_id') == vacancy_id), None)
          if not result:
              raise SystemExit(f'generation result missing for {vacancy_id}')
          status = result.get('status')
          if status not in {'PASS', 'COMPLETED_BELOW_TARGET'}:
              raise SystemExit(f'generation semantic status is {status}: {result.get("error")}')
          print('generation_semantic_gate=PASS', status)
          PY

      - name: Generate and semantically validate grounded cover letter
        id: cover
        if: steps.generation.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m cv_agent.cover_letter_batch \
            --batch-report "outputs/auto/_batch/$CANARY_RUN_ID/generation_run_report.json" \
            --outputs outputs/auto \
            --vacancy-state /tmp/vacancy_state \
            --generation-state /tmp/generation_state \
            --max-estimated-cost-usd 1.5

          python - <<'PY'
          import json, os
          from pathlib import Path

          vacancy_id = os.environ['CANARY_VACANCY_ID']
          run_id = os.environ['CANARY_RUN_ID']
          batch = json.loads((Path('outputs/auto/_batch') / run_id / 'generation_run_report.json').read_text(encoding='utf-8'))
          result = next(item for item in batch.get('results', []) if item.get('vacancy_id') == vacancy_id)
          generated_run_id = result.get('run_id')
          cover = Path('outputs/auto') / vacancy_id / str(generated_run_id) / 'cover_letter_final.md'
          if not cover.is_file() or cover.stat().st_size == 0:
              raise SystemExit(f'cover letter artifact missing: {cover}')
          print('cover_semantic_gate=PASS', cover)
          PY

      - name: Build and semantically validate HTML/PDF presentation bundle
        id: presentation
        if: steps.cover.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m cv_presentation.batch_bundle \
            --batch-report "outputs/auto/_batch/$CANARY_RUN_ID/generation_run_report.json" \
            --outputs outputs/auto \
            --vacancy-state /tmp/vacancy_state \
            --generation-state /tmp/generation_state \
            --identity-public cv_presentation/identity.public.yaml \
            --brand-profiles-dir cv_presentation/brands \
            --max-design-cost-usd 1.5

          python - <<'PY'
          import json, os
          from pathlib import Path

          vacancy_id = os.environ['CANARY_VACANCY_ID']
          run_id = os.environ['CANARY_RUN_ID']
          generation = json.loads((Path('outputs/auto/_batch') / run_id / 'generation_run_report.json').read_text(encoding='utf-8'))
          generated = next(item for item in generation.get('results', []) if item.get('vacancy_id') == vacancy_id)
          generated_run_id = generated.get('run_id')
          bundle_batch = json.loads((Path('outputs/auto/_batch') / run_id / 'application_bundle_batch_report.json').read_text(encoding='utf-8'))
          result = next((item for item in bundle_batch.get('results', []) if item.get('vacancy_id') == vacancy_id), None)
          if not result:
              raise SystemExit(f'presentation result missing for {vacancy_id}')
          status = result.get('status')
          if status not in {'PASS', 'REVIEW_REQUIRED'}:
              raise SystemExit(f'presentation semantic status is {status}: {result.get("error") or result.get("reason")}')

          run_dir = Path('outputs/auto') / vacancy_id / str(generated_run_id)
          required = ['cv_primary.html', 'cv_primary.pdf', 'application_bundle_report.json']
          missing = [name for name in required if not (run_dir / name).is_file()]
          if missing:
              raise SystemExit(f'presentation artifacts missing: {missing}')
          print('presentation_semantic_gate=PASS', status)
          PY

      - name: Build structured E2E diagnostic
        if: always()
        env:
          RETRIEVAL_OUTCOME: ${{ steps.retrieval.outcome }}
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          COVER_OUTCOME: ${{ steps.cover.outcome }}
          PRESENTATION_OUTCOME: ${{ steps.presentation.outcome }}
        run: |
          python -m cv_observability.production_canary \
            --outputs-root outputs/auto \
            --generation-state /tmp/generation_state \
            --vacancy-id "$CANARY_VACANCY_ID" \
            --run-id "$CANARY_RUN_ID" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --retrieval-process "$RETRIEVAL_OUTCOME" \
            --generation-process "$GENERATION_OUTCOME" \
            --cover-process "$COVER_OUTCOME" \
            --presentation-process "$PRESENTATION_OUTCOME" \
            --output /tmp/production-canary-summary.json

      - name: Add canary summary to workflow
        if: always()
        run: |
          echo '## Production readiness canary' >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/production-canary-summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/production-canary-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-canary-${{ github.run_id }}
          path: |
            outputs/auto/
            /tmp/production-canary-summary.json
            /tmp/cvfit-observability/
          if-no-files-found: warn
          retention-days: 7

      - name: Propagate canary health
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/production-canary-summary.json')
          if not path.exists():
              raise SystemExit('production canary diagnostic missing')
          summary = json.loads(path.read_text(encoding='utf-8'))
          if summary.get('canary_healthy') is not True:
              raise SystemExit('production canary is not healthy; inspect the structured summary above')
          print('production_canary=PASS')
          PY
