name: Validate and run CV ADK agent

on:
  pull_request:
    paths:
      - "GPTW/**/*.json"
      - "Vacantes/**/*.json"
      - "cv_agent/**"
      - "cv_matching/**"
      - "cv_presentation/**"
      - "rag/**"
      - "vacancy_pipeline/**"
      - "contracts/vacancies/**"
      - "tests/test_cv_*.py"
      - "tests/test_cover_letter.py"
      - "tests/test_openai_provider.py"
      - "tests/test_vacancy_fidelity.py"
      - "pyproject.toml"
      - "agents-cli-manifest.yaml"
      - ".github/workflows/cv-agent.yml"
  push:
    branches: [main]
    paths:
      - "GPTW/**/*.json"
      - "Vacantes/**/*.json"
      - "cv_agent/**"
      - "cv_matching/**"
      - "cv_presentation/**"
      - "rag/**"
      - "vacancy_pipeline/**"
      - "contracts/vacancies/**"
      - "tests/test_cv_*.py"
      - "tests/test_cover_letter.py"
      - "tests/test_openai_provider.py"
      - "tests/test_vacancy_fidelity.py"
      - "pyproject.toml"
      - "agents-cli-manifest.yaml"
      - ".github/workflows/cv-agent.yml"
  workflow_dispatch:
    inputs:
      vacancy_id:
        description: "Canonical vacancy_id to generate"
        required: true
        default: "vac-04e92192e608ea02"
        type: string

permissions:
  contents: read

jobs:
  validate-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ADK and presentation project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install Chromium for physical layout validation
        run: python -m playwright install --with-deps chromium
      - name: Run deterministic agent, matching, presentation, layout and cover-letter tests
        run: >-
          python -m unittest
          tests.test_cv_matching
          tests.test_cv_validators
          tests.test_cv_agent_workflow
          tests.test_cv_telemetry
          tests.test_cv_presentation
          tests.test_cv_templates
          tests.test_cv_physical_layout
          tests.test_cover_letter
          tests.test_openai_provider
          tests.test_vacancy_fidelity
          -v
      - name: Build current vacancy and professional evidence states
        run: |
          python -m vacancy_pipeline --repo . --state-dir /tmp/vacancy_state --run-id agent-context --source-commit "$(git rev-parse HEAD)" --full-rebuild --fail-on-quarantine
          python -m rag.evidence --repo . --state-dir /tmp/rag_state --run-id agent-context --source-commit "$(git rev-parse HEAD)" --full-rebuild
      - name: Validate all current vacancies have full JD and grounded analysis context
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          from cv_agent.context import assemble_application_context

          records = sorted(Path("/tmp/vacancy_state/records").glob("*.json"))
          assert len(records) == 6, f"expected the six 2026-08-21 canonical vacancies, got {len(records)}"
          fidelity = Counter()
          eligible = []
          for path in records:
              context = assemble_application_context(
                  path.stem,
                  vacancy_state=Path("/tmp/vacancy_state"),
                  evidence_state=Path("/tmp/rag_state"),
                  allow_sparse_jd=True,
              )
              vacancy = context["vacancy"]
              assert vacancy["application_language"] != "und", f"undetermined language for {path.stem}"
              assert vacancy["jd_fidelity"] == "full", vacancy
              assert vacancy["jd_generation_eligible"] is True, vacancy
              assert vacancy["requirements"], vacancy
              assert vacancy["responsibilities"], vacancy
              assert vacancy["fit_score"] is not None, f"source fit lost during enrichment merge for {path.stem}"
              assert context["evidence_chunks"], f"no eligible evidence for {path.stem}"
              fidelity[vacancy["jd_fidelity"]] += 1
              eligible.append(path.stem)
              print(
                  path.stem,
                  "company=", vacancy["company"],
                  "language=", vacancy["application_language"],
                  "jd_fidelity=", vacancy["jd_fidelity"],
                  "jd_score=", vacancy["jd_fidelity_score"],
                  "source_fit=", vacancy["fit_score"],
                  "coverage=", context["match_plan"]["coverage_score"],
                  "evidence_chunks=", len(context["evidence_chunks"]),
              )
          print("fidelity_counts=", dict(sorted(fidelity.items())))
          print("generation_eligible=", eligible)
          PY
      - name: Validate Konfio canary preflight without model calls
        run: |
          python - <<'PY'
          from pathlib import Path
          from cv_agent.context import assemble_application_context

          vacancy_id = "vac-04e92192e608ea02"
          context = assemble_application_context(
              vacancy_id,
              vacancy_state=Path("/tmp/vacancy_state"),
              evidence_state=Path("/tmp/rag_state"),
          )
          vacancy = context["vacancy"]
          sources = {item["source_path"] for item in vacancy["provenance"]}
          assert vacancy["company"] == "Konfío", vacancy
          assert vacancy["jd_fidelity"] == "full", vacancy
          assert vacancy["jd_generation_eligible"] is True, vacancy
          assert vacancy["application_language"] == "es", vacancy
          assert "GPTW/enriched/konfio_ai_ml_engineer_sr_2026-08-18.json" in sources, sources
          print(
              "canary_preflight=PASS",
              "jd_score=", vacancy["jd_fidelity_score"],
              "language=", vacancy["application_language"],
              "coverage=", context["match_plan"]["coverage_score"],
              "sources=", sorted(sources),
          )
          PY
      - name: Import OpenAI-backed ADK app without live credentials
        run: python -c "from cv_agent.agent import app, root_agent; assert app is not None; assert root_agent.name == 'root_agent'"

  generate-manual:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-agent
    runs-on: ubuntu-latest
    env:
      OPENAI_APY_KEY: ${{ secrets.OPENAI_APY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ADK and presentation project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install Chromium for PDF validation
        run: python -m playwright install --with-deps chromium
      - name: Require configured OpenAI API secret
        run: |
          if [ -z "$OPENAI_APY_KEY" ]; then
            echo "Missing repository secret OPENAI_APY_KEY; live generation was not attempted."
            exit 2
          fi
      - name: Rebuild isolated current vacancy and evidence state
        run: |
          python -m vacancy_pipeline --repo . --state-dir /tmp/vacancy_state --run-id manual-live --source-commit "$(git rev-parse HEAD)" --full-rebuild --fail-on-quarantine
          python -m rag.evidence --repo . --state-dir /tmp/rag_state --run-id manual-live --source-commit "$(git rev-parse HEAD)" --full-rebuild
      - name: Generate CV and concise cover letter with OpenAI-backed ADK
        run: >-
          python -m cv_agent.run
          --vacancy-id "${{ inputs.vacancy_id }}"
          --vacancy-state /tmp/vacancy_state
          --evidence-state /tmp/rag_state
          --outputs outputs
          --run-id "${{ github.run_id }}"
      - name: Build branded and Harvard HTML/PDF variants and physical layout gate
        run: >-
          python -m cv_presentation.bundle_cli
          --vacancy-id "${{ inputs.vacancy_id }}"
          --vacancy-state /tmp/vacancy_state
          --run-dir "outputs/${{ inputs.vacancy_id }}/${{ github.run_id }}"
          --identity-public cv_presentation/identity.public.yaml
          --brand-profiles-dir cv_presentation/brands
          --max-design-cost-usd 0.75
      - uses: actions/upload-artifact@v4
        with:
          name: cv-${{ inputs.vacancy_id }}-${{ github.run_id }}
          path: outputs/${{ inputs.vacancy_id }}/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14
