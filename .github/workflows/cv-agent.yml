name: Validate and run CV ADK agent

on:
  pull_request:
    paths:
      - "cv_agent/**"
      - "cv_matching/**"
      - "rag/**"
      - "vacancy_pipeline/**"
      - "contracts/vacancies/**"
      - "tests/test_cv_*.py"
      - "pyproject.toml"
      - "agents-cli-manifest.yaml"
      - ".github/workflows/cv-agent.yml"
  workflow_dispatch:
    inputs:
      vacancy_id:
        description: "Canonical vacancy_id to generate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ADK project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run deterministic agent and matching tests
        run: >-
          python -m unittest
          tests.test_cv_matching
          tests.test_cv_validators
          tests.test_cv_agent_workflow
          -v
      - name: Import ADK app
        run: python -c "from cv_agent.agent import app, root_agent; assert app is not None; assert root_agent.name == 'root_agent'"

  generate-manual:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-agent
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ADK project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Require configured Gemini API secret
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "Missing repository secret GEMINI_API_KEY; live generation was not attempted."
            exit 2
          fi
      - name: Rebuild isolated current vacancy and evidence state
        run: |
          python -m vacancy_pipeline --repo . --state-dir /tmp/vacancy_state --run-id manual-live --source-commit "$(git rev-parse HEAD)" --full-rebuild --fail-on-quarantine
          python -m rag.evidence --repo . --state-dir /tmp/rag_state --run-id manual-live --source-commit "$(git rev-parse HEAD)" --full-rebuild
      - name: Generate and review CV with ADK
        run: >-
          python -m cv_agent.run
          --vacancy-id "${{ inputs.vacancy_id }}"
          --vacancy-state /tmp/vacancy_state
          --evidence-state /tmp/rag_state
          --outputs outputs
          --run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cv-${{ inputs.vacancy_id }}-${{ github.run_id }}
          path: outputs/${{ inputs.vacancy_id }}/${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14
