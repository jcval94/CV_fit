name: Incremental professional evidence RAG state

on:
  pull_request:
    paths:
      - "experience/**/*.md"
      - "rag/**"
      - "cv_matching/**"
      - "evals/retrieval/**"
      - "tests/test_rag_*.py"
      - "tests/test_retrieval_v2.py"
      - ".github/workflows/evidence-rag.yml"
  push:
    branches: [main]
    paths:
      - "experience/**/*.md"
      - "rag/**"
      - "cv_matching/**"
      - "evals/retrieval/**"
      - "tests/test_rag_*.py"
      - "tests/test_retrieval_v2.py"
      - ".github/workflows/evidence-rag.yml"
  workflow_dispatch:

concurrency:
  group: evidence-rag-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-or-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install retrieval dependencies
        run: python -m pip install --disable-pip-version-check pyyaml 'openai>=2.20.0,<3.0.0'

      - name: Validate canonical source and RAG tests
        run: |
          python tools/validate_experience.py
          python -m unittest tests.test_rag_normalize tests.test_rag_evidence tests.test_retrieval_v2 -v

      - name: Validate PR evidence E2E
        if: github.event_name == 'pull_request'
        run: >-
          python -m rag.evidence
          --repo .
          --state-dir /tmp/cv-fit-rag-state
          --run-id pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          --source-commit ${{ github.sha }}
          --full-rebuild

      - name: Prove PR evidence no-op idempotence
        if: github.event_name == 'pull_request'
        run: |
          python -m rag.evidence \
            --repo . \
            --state-dir /tmp/cv-fit-rag-state \
            --run-id pr-${{ github.event.pull_request.number }}-${{ github.sha }}-noop \
            --source-commit ${{ github.sha }}
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cv-fit-rag-state/latest_run.json').read_text(encoding='utf-8'))
          assert report['source_counts']['new'] == 0, report
          assert report['source_counts']['modified'] == 0, report
          assert report['record_counts']['impacted'] == 0, report
          assert report['record_counts']['reindexed'] == 0, report
          print('evidence_noop_idempotence=PASS', report['source_counts'], report['record_counts'])
          PY

      - name: Lexical retrieval baseline on PR
        if: github.event_name == 'pull_request'
        run: |
          python -m rag.retrieve "fraud anomaly detection Python" --state-dir /tmp/cv-fit-rag-state --top-k 5
          python -m rag.evals --state-dir /tmp/cv-fit-rag-state --mode lexical --output /tmp/lexical_eval.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/lexical_eval.json', encoding='utf-8'))
          print('lexical_eval=', {k: data[k] for k in ('pass_rate','positive_recall_at_k','positive_mrr','negative_safety_rate')})
          PY

      - name: Sync latest main before incremental index
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "PROCESSED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Incrementally index main evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          python -m rag.evidence
          --repo .
          --state-dir rag_state
          --run-id ${{ env.PROCESSED_SHA }}
          --source-commit ${{ env.PROCESSED_SHA }}

      - name: Prove main evidence no-op idempotence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m rag.evidence \
            --repo . \
            --state-dir rag_state \
            --run-id "${PROCESSED_SHA}-noop" \
            --source-commit "$PROCESSED_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('rag_state/latest_run.json').read_text(encoding='utf-8'))
          assert report['source_counts']['new'] == 0, report
          assert report['source_counts']['modified'] == 0, report
          assert report['record_counts']['impacted'] == 0, report
          assert report['record_counts']['reindexed'] == 0, report
          print('main_evidence_noop_idempotence=PASS', report['source_counts'], report['record_counts'])
          PY

      - name: Incrementally embed active evidence with OpenAI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OPENAI_APY_KEY: ${{ secrets.OPENAI_APY_KEY }}
        run: |
          if [ -z "$OPENAI_APY_KEY" ]; then
            echo "Missing repository secret OPENAI_APY_KEY; dense index cannot be updated."
            exit 2
          fi
          python -m rag.dense --state-dir rag_state

      - name: Prove dense no-op idempotence without another paid embedding call
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          OPENAI_APY_KEY: ${{ secrets.OPENAI_APY_KEY }}
        run: |
          python -m rag.dense --state-dir rag_state > /tmp/dense-noop.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/dense-noop.json', encoding='utf-8'))
          assert data['embedded'] == 0, data
          assert data['removed'] == 0, data
          print('dense_noop_idempotence=PASS', data)
          PY

      - name: Retrieval smoke test on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m rag.retrieve "machine learning production GenAI" --state-dir rag_state --top-k 5

      - name: Commit versioned evidence state
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rag_state
          if git diff --cached --quiet; then
            echo "No evidence state changes to commit."
            exit 0
          fi
          git commit -m "chore: update evidence RAG state for ${PROCESSED_SHA::12}"
          git pull --rebase origin main
          git push origin HEAD:main
