name: Validate experience source of truth

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jinja2 pyyaml 'pydantic>=2.8,<3.0'
      - run: python tools/validate_experience.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m rag.normalize --repo . --check
