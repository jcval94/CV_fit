name: Record provider cost statement

on:
  workflow_dispatch:
    inputs:
      period_start:
        description: "Inclusive ISO-8601 UTC/offset start of billing period"
        required: true
        type: string
      period_end:
        description: "Exclusive ISO-8601 UTC/offset end of billing period"
        required: true
        type: string
      actual_cost_usd:
        description: "Actual provider usage/billing amount in USD for this period"
        required: true
        type: string
      scope_kind:
        description: "Does this provider amount contain only CV_fit usage?"
        required: true
        default: MIXED_PROVIDER_ACCOUNT
        type: choice
        options:
          - MIXED_PROVIDER_ACCOUNT
          - CV_FIT_DEDICATED_SCOPE

permissions:
  contents: write

concurrency:
  group: cvfit-provider-reconciliation
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record provider statement without storing invoice identifiers
        env:
          PERIOD_START: ${{ inputs.period_start }}
          PERIOD_END: ${{ inputs.period_end }}
          ACTUAL_COST_USD: ${{ inputs.actual_cost_usd }}
          SCOPE_KIND: ${{ inputs.scope_kind }}
          RECORDED_BY: ${{ github.actor }}
        run: >-
          python -m cv_observability.provider_reconciliation
          --state generation_state/provider_reconciliation.json
          --period-start "$PERIOD_START"
          --period-end "$PERIOD_END"
          --actual-cost-usd "$ACTUAL_COST_USD"
          --scope-kind "$SCOPE_KIND"
          --recorded-by "$RECORDED_BY"

      - name: Persist reconciliation evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generation_state/provider_reconciliation.json
          if git diff --cached --quiet; then
            echo "Provider statement already existed; no state change."
            exit 0
          fi
          git commit -m "chore: record provider cost reconciliation period"
          git pull --rebase origin main
          git push origin HEAD:main
