name: Authenticated retrieval V2 benchmark

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    if: >-
      (github.event_name == 'issues' && github.event.issue.title == '[eval] Run retrieval v2 benchmark') ||
      (github.event_name == 'issue_comment' && github.event.issue.title == '[eval] Run retrieval v2 benchmark' && github.event.comment.body == '[eval] rerun retrieval v2 benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_APY_KEY: ${{ secrets.OPENAI_APY_KEY }}
      BENCHMARK_ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Require existing OpenAI secret and versioned retrieval state
        run: |
          if [ -z "$OPENAI_APY_KEY" ]; then
            echo "Missing OPENAI_APY_KEY; authenticated benchmark was not attempted."
            exit 2
          fi
          test -s rag_state/lexical_index.json
          test -s rag_state/dense_index.json
          test -s rag_state/relations.json
          test -d vacancy_state/records

      - name: Run authenticated V1 to V2 benchmark
        id: run_benchmark
        continue-on-error: true
        run: |
          mkdir -p /tmp/retrieval-eval
          {
            echo "benchmark_commit=$(git rev-parse HEAD)"
            echo "running lexical eval"
            python -m rag.evals --state-dir rag_state --mode lexical --output /tmp/retrieval-eval/lexical.json
            echo "running hybrid eval"
            python -m rag.evals --state-dir rag_state --mode hybrid --output /tmp/retrieval-eval/hybrid.json
            echo "running hybrid-rerank eval"
            python -m rag.evals --state-dir rag_state --mode hybrid-rerank --output /tmp/retrieval-eval/hybrid_rerank.json
            echo "running Konfio lexical match"
            python -m cv_matching.match vac-04e92192e608ea02 --vacancy-state vacancy_state --evidence-state rag_state --retrieval-mode lexical --output /tmp/retrieval-eval/konfio_lexical.json
            echo "running Konfio V2 match"
            python -m cv_matching.match vac-04e92192e608ea02 --vacancy-state vacancy_state --evidence-state rag_state --retrieval-mode hybrid-rerank --output /tmp/retrieval-eval/konfio_v2.json
          } > /tmp/retrieval-eval/benchmark.log 2>&1

      - name: Post sanitized benchmark diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_OUTCOME: ${{ steps.run_benchmark.outcome }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/retrieval-eval')
          required = {
              'lexical': root / 'lexical.json',
              'hybrid': root / 'hybrid.json',
              'hybrid_rerank': root / 'hybrid_rerank.json',
              'konfio_lexical': root / 'konfio_lexical.json',
              'konfio_v2': root / 'konfio_v2.json',
          }
          missing = [name for name, path in required.items() if not path.exists()]
          outcome = os.environ.get('BENCHMARK_OUTCOME', 'unknown')

          print('### Retrieval V2 authenticated benchmark')
          print('')
          if missing:
              log_path = root / 'benchmark.log'
              log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else 'benchmark log missing'
              diagnostic = {
                  'status': 'FAILED',
                  'workflow_outcome': outcome,
                  'missing_artifacts': missing,
                  'log_tail': log[-8000:],
              }
              print('The benchmark did not complete. Sanitized diagnostic:')
              print('```json')
              print(json.dumps(diagnostic, ensure_ascii=False, indent=2, sort_keys=True))
              print('```')
              raise SystemExit(0)

          lexical = json.loads(required['lexical'].read_text(encoding='utf-8'))
          hybrid = json.loads(required['hybrid'].read_text(encoding='utf-8'))
          rerank = json.loads(required['hybrid_rerank'].read_text(encoding='utf-8'))
          old = json.loads(required['konfio_lexical'].read_text(encoding='utf-8'))
          new = json.loads(required['konfio_v2'].read_text(encoding='utf-8'))

          def metrics(data):
              return {key: data[key] for key in (
                  'pass_rate', 'positive_recall_at_k', 'positive_mrr',
                  'negative_safety_rate', 'forbidden_direct_hit_count'
              )}

          def req_map(plan):
              return {
                  item['requirement']: {
                      'coverage': item['coverage'],
                      'evidence_chunk_ids': item['evidence_chunk_ids'],
                  }
                  for item in plan['requirements']
              }

          old_req = req_map(old)
          new_req = req_map(new)
          changed = []
          for requirement in sorted(set(old_req) | set(new_req)):
              if old_req.get(requirement) != new_req.get(requirement):
                  changed.append({
                      'requirement': requirement,
                      'lexical': old_req.get(requirement),
                      'v2': new_req.get(requirement),
                  })

          summary = {
              'status': 'SUCCESS',
              'workflow_outcome': outcome,
              'lexical_metrics': metrics(lexical),
              'hybrid_metrics': metrics(hybrid),
              'hybrid_rerank_metrics': metrics(rerank),
              'konfio_lexical_coverage': old['coverage_score'],
              'konfio_v2_coverage': new['coverage_score'],
              'konfio_v2_counts': new['coverage_counts'],
              'changed_requirements': changed,
              'hybrid_rerank_cases': rerank['results'],
          }
          print('```json')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          print('```')
          PY
          gh issue comment "$BENCHMARK_ISSUE_NUMBER" --body-file /tmp/comment.md

      - name: Propagate benchmark failure after diagnostic
        if: steps.run_benchmark.outcome != 'success'
        run: |
          echo "Retrieval benchmark failed after publishing a sanitized diagnostic to issue #$BENCHMARK_ISSUE_NUMBER."
          exit 1
