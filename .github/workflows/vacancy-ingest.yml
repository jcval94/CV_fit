name: Incremental vacancy ingest

on:
  pull_request:
    paths:
      - "GPTW/**/*.json"
      - "Vacantes/**/*.json"
      - "vacancy_pipeline/**"
      - "contracts/vacancies/**"
      - "cv_auto/**"
      - "cv_agent/cover_letter.py"
      - "cv_agent/cover_letter_batch.py"
      - "tests/test_vacancy_*.py"
      - "tests/test_cv_auto.py"
      - "tests/test_cover_letter.py"
      - ".github/workflows/vacancy-ingest.yml"
  push:
    branches: [main]
    paths:
      - "GPTW/**/*.json"
      - "Vacantes/**/*.json"
      - "vacancy_pipeline/**"
      - "contracts/vacancies/**"
      - "cv_auto/**"
      - "cv_agent/cover_letter.py"
      - "cv_agent/cover_letter_batch.py"
      - "tests/test_vacancy_*.py"
      - "tests/test_cv_auto.py"
      - "tests/test_cover_letter.py"
      - ".github/workflows/vacancy-ingest.yml"
  workflow_dispatch:

concurrency:
  group: vacancy-ingest-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-or-ingest:
    runs-on: ubuntu-latest
    env:
      # Enabled after issue #15 passed the authenticated Retrieval V2 safety gate.
      AUTO_CV_ENABLED: "true"
      OPENAI_APY_KEY: ${{ secrets.OPENAI_APY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run vacancy and automatic-generation tests
        run: >-
          python -m unittest
          tests.test_vacancy_pipeline
          tests.test_vacancy_fidelity
          tests.test_cv_auto
          tests.test_cover_letter
          -v

      - name: Validate PR inputs E2E
        if: github.event_name == 'pull_request'
        run: >-
          python -m vacancy_pipeline
          --repo .
          --state-dir /tmp/cv-fit-vacancy-state
          --run-id pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          --source-commit ${{ github.sha }}
          --full-rebuild
          --fail-on-quarantine

      - name: Prove PR vacancy no-op idempotence
        if: github.event_name == 'pull_request'
        run: |
          python -m vacancy_pipeline \
            --repo . \
            --state-dir /tmp/cv-fit-vacancy-state \
            --run-id pr-${{ github.event.pull_request.number }}-${{ github.sha }}-noop \
            --source-commit ${{ github.sha }} \
            --fail-on-quarantine
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/cv-fit-vacancy-state/latest_run.json').read_text(encoding='utf-8'))
          assert report['source_counts']['new'] == 0, report
          assert report['source_counts']['modified'] == 0, report
          assert report['source_counts']['quarantined'] == 0, report
          assert report['vacancy_counts']['impacted'] == 0, report
          assert report['vacancy_counts']['reindexed'] == 0, report
          print('vacancy_noop_idempotence=PASS', report['source_counts'], report['vacancy_counts'])
          PY

      - name: Sync latest main before incremental ingest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "PROCESSED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Incrementally ingest main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          python -m vacancy_pipeline
          --repo .
          --state-dir vacancy_state
          --run-id ${{ env.PROCESSED_SHA }}
          --source-commit ${{ env.PROCESSED_SHA }}

      - name: Capture impacted vacancies before no-op proof
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp vacancy_state/latest_run.json /tmp/vacancy-ingest-run.json

      - name: Prove main vacancy no-op idempotence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m vacancy_pipeline \
            --repo . \
            --state-dir vacancy_state \
            --run-id "${PROCESSED_SHA}-noop" \
            --source-commit "$PROCESSED_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('vacancy_state/latest_run.json').read_text(encoding='utf-8'))
          assert report['source_counts']['new'] == 0, report
          assert report['source_counts']['modified'] == 0, report
          assert report['vacancy_counts']['impacted'] == 0, report
          assert report['vacancy_counts']['reindexed'] == 0, report
          print('main_vacancy_noop_idempotence=PASS', report['source_counts'], report['vacancy_counts'])
          PY

      - name: Retrieval smoke test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m vacancy_pipeline.retrieve "machine learning" --state-dir vacancy_state --top-k 3 > /tmp/vacancy-retrieval.json
          cat /tmp/vacancy-retrieval.json

      - name: Install CV generation project
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.AUTO_CV_ENABLED == 'true'
        run: python -m pip install --disable-pip-version-check -e .

      - name: Generate CV artifacts for new or modified eligible vacancies
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.AUTO_CV_ENABLED == 'true'
        run: >-
          python -m cv_auto
          --ingest-report /tmp/vacancy-ingest-run.json
          --vacancy-state vacancy_state
          --evidence-state rag_state
          --generation-state generation_state
          --outputs outputs/auto
          --run-id auto-${{ env.PROCESSED_SHA }}
          --source-commit ${{ env.PROCESSED_SHA }}
          --retrieval-mode hybrid-rerank
          --max-vacancies-per-run 5
          --max-estimated-cost-usd 2.0

      - name: Generate concise grounded cover letters for generated CVs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.AUTO_CV_ENABLED == 'true'
        run: >-
          python -m cv_agent.cover_letter_batch
          --batch-report outputs/auto/_batch/auto-${{ env.PROCESSED_SHA }}/generation_run_report.json
          --outputs outputs/auto
          --vacancy-state vacancy_state
          --max-estimated-cost-usd 1.0

      - name: Upload generated application artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.AUTO_CV_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auto-cv-${{ github.run_id }}
          path: outputs/auto/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit versioned vacancy and generation state
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vacancy_state
          if [ -d generation_state ]; then
            git add generation_state
          fi
          if git diff --cached --quiet; then
            echo "No vacancy/generation state changes to commit."
            exit 0
          fi
          git commit -m "chore: update vacancy generation state for ${PROCESSED_SHA::12}"
          git pull --rebase origin main
          git push origin HEAD:main
