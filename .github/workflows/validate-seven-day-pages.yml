name: Validate 7-day Pages history

on:
  pull_request:
    paths:
      - "cv_presentation/history_merge.py"
      - "cv_presentation/manual_send_status.py"
      - "tests/test_cv_history_merge.py"
      - ".github/workflows/seven-day-pages.yml"
      - ".github/workflows/validate-seven-day-pages.yml"
  push:
    branches: [main]
    paths:
      - "cv_presentation/history_merge.py"
      - "cv_presentation/manual_send_status.py"
      - "tests/test_cv_history_merge.py"
      - ".github/workflows/seven-day-pages.yml"
      - ".github/workflows/validate-seven-day-pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Test seven-day history and local Status control
        run: python -m unittest tests.test_cv_history_merge -v
