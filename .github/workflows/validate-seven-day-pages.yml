name: Validate 7-day Pages history

on:
  pull_request:
    paths:
      - "cv_presentation/history_merge.py"
      - "cv_presentation/manual_send_status.py"
      - "cv_observability/manual_attribution.py"
      - "generation_requests/**/*.json"
      - "generation_retry_requests/**/*.json"
      - "tests/test_cv_history_merge.py"
      - "tests/test_manual_attribution.py"
      - ".github/workflows/manual-cv-generation.yml"
      - ".github/workflows/manual-cv-generation-retry.yml"
      - ".github/workflows/seven-day-pages.yml"
      - ".github/workflows/validate-seven-day-pages.yml"
  push:
    branches: [main]
    paths:
      - "cv_presentation/history_merge.py"
      - "cv_presentation/manual_send_status.py"
      - "cv_observability/manual_attribution.py"
      - "generation_requests/**/*.json"
      - "generation_retry_requests/**/*.json"
      - "tests/test_cv_history_merge.py"
      - "tests/test_manual_attribution.py"
      - ".github/workflows/manual-cv-generation.yml"
      - ".github/workflows/manual-cv-generation-retry.yml"
      - ".github/workflows/seven-day-pages.yml"
      - ".github/workflows/validate-seven-day-pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Test seven-day history, local Status and manual spend attribution
        run: >-
          python -m unittest
          tests.test_cv_history_merge
          tests.test_manual_attribution
          -v
