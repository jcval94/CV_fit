[project]
name = "cv-fit-agent"
version = "0.1.0"
description = "Evidence-grounded incremental vacancy matching and ADK CV review workflow"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.0.0,<3.0.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
gcp = ["google-adk[gcp]>=2.0.0,<3.0.0"]

[tool.setuptools.packages.find]
include = ["cv_agent*", "cv_matching*", "rag*", "vacancy_pipeline*"]
