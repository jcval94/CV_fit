[project]
name = "cv-fit-agent"
version = "0.1.0"
description = "Evidence-grounded incremental vacancy matching and OpenAI-backed ADK CV review workflow"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.0.0,<3.0.0",
  "litellm>=1.97.0,<2.0.0",
  "openai>=2.20.0,<3.0.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["cv_agent*", "cv_auto*", "cv_matching*", "rag*", "vacancy_pipeline*"]
