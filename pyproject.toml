[project]
name = "cv-fit-agent"
version = "0.1.0"
description = "Evidence-grounded incremental vacancy matching and OpenAI-backed ADK CV review workflow"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.0.0,<3.0.0",
  "jinja2>=3.1,<4.0",
  "litellm>=1.97.0,<2.0.0",
  "openai>=2.20.0,<3.0.0",
  "playwright>=1.54,<2.0",
  "pydantic>=2.8,<3.0",
  "pypdf>=5.0,<7.0",
  "pyyaml>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["cv_agent*", "cv_auto*", "cv_handoff*", "cv_matching*", "cv_notifications*", "cv_observability*", "cv_presentation*", "rag*", "vacancy_pipeline*"]

[tool.setuptools.package-data]
cv_presentation = ["templates/*.j2", "*.yaml", "brands/*.yaml"]
